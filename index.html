          "name": "What types of vehicles and transport modes does NexusVectis support?",

          }
        },
        {
          "@type": "Question",
          "name": "What is the pricing model?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Usage-based pricing: €15/month per vehicle, €40/month per resource, €5 per 100 FLEET AI commands, €5 per 100 API calls. No hidden fees, cancel anytime."
          }
        },
        {
          "@type": "Question",
          "name": "Is NexusVectis suitable for small fleets?",
          "acceptedAnswer": {
            "@type": "Answer",

          }
